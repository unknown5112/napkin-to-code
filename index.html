<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Napkin-to-Code ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CSS Loader */
        .loader {
            border: 4px solid #1e293b;
            border-top: 4px solid #8b5cf6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header -->
    <div class="text-center mb-8">
        <h1 class="text-4xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent inline-flex items-center gap-2">
            Napkin-to-Code 🪄
        </h1>
        <p class="text-gray-400 mt-2 text-sm max-w-xs mx-auto">
            Draw a wireframe, upload it, and watch AI write your code.
        </p>
    </div>

    <!-- Main Card -->
    <div class="bg-gray-800 p-6 rounded-2xl shadow-xl w-full max-w-md border border-gray-700 mb-8">
        
        <!-- Hidden Inputs for Camera and Gallery -->
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="previewImage(event)">
        <input type="file" id="galleryInput" accept="image/*" class="hidden" onchange="previewImage(event)">

        <!-- Upload Buttons -->
        <div class="flex flex-col gap-3 mb-6">
            <button onclick="document.getElementById('cameraInput').click()" 
                class="w-full py-3 bg-gray-700 hover:bg-gray-600 rounded-xl font-medium transition-colors flex items-center justify-center gap-2">
                📸 Take a Photo
            </button>
            <button onclick="document.getElementById('galleryInput').click()" 
                class="w-full py-3 bg-gray-700 hover:bg-gray-600 rounded-xl font-medium transition-colors flex items-center justify-center gap-2">
                📁 Choose from Gallery
            </button>
        </div>

        <!-- Image Preview Area -->
        <div id="previewContainer" class="hidden mb-6 flex justify-center">
            <img id="imagePreview" class="max-h-48 rounded-lg border-2 border-gray-600 object-contain">
        </div>

        <!-- Generate Button -->
        <button id="generateBtn" onclick="handleGenerateUI()" 
            class="w-full py-3 bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 rounded-xl font-bold text-white shadow-lg shadow-purple-500/30 transition-all opacity-50 cursor-not-allowed" disabled>
            Generate UI 🚀
        </button>

        <!-- Loading State -->
        <div id="loadingState" class="hidden mt-6 text-center">
            <div class="loader mb-3"></div>
            <p id="loading-text" class="text-gray-400 text-sm animate-pulse">Compressing image...</p>
        </div>

    </div>

    <!-- Results Area with Live Preview -->
    <div id="resultContainer" class="hidden w-full max-w-xl mb-12 p-4 bg-gray-800 rounded-xl border border-gray-700">
        <h2 class="text-lg font-semibold mb-2">Generated Code:</h2>
        <textarea id="codeOutput" class="w-full h-32 bg-gray-900 text-green-400 p-3 rounded-lg font-mono text-sm border border-gray-700 outline-none mb-6" readonly></textarea>
        
        <h2 class="text-lg font-semibold mb-2">✨ Live Preview:</h2>
        <iframe id="previewFrame" class="w-full h-96 bg-white rounded-lg border border-gray-600"></iframe>
    </div>

    <!-- SCRIPT SECTION -->
    <script>
        const BACKEND_URL = "https://napkin-backend.onrender.com/generate-ui"; 
        let selectedFile = null;

        // 1. Preview Image logic
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('previewContainer').classList.remove('hidden');
                    
                    const btn = document.getElementById('generateBtn');
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                    btn.disabled = false;
                }
                reader.readAsDataURL(file);
            }
        }

        // 2. The Lifesaver Compression Function
        function compressImage(file, maxSize = 800) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > height && width > maxSize) {
                            height *= maxSize / width;
                            width = maxSize;
                        } else if (height > maxSize) {
                            width *= maxSize / height;
                            height = maxSize;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        resolve(compressedBase64);
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        // 3. API Call Logic
        async function handleGenerateUI() {
            if (!selectedFile) {
                alert("Please select or click a photo first!");
                return;
            }

            const genBtn = document.getElementById('generateBtn');
            const loaderContainer = document.getElementById('loadingState');
            const loadingText = document.getElementById('loading-text');
            const resultContainer = document.getElementById('resultContainer');
            
            genBtn.disabled = true;
            genBtn.classList.add('opacity-50', 'cursor-not-allowed');
            resultContainer.classList.add('hidden');
            loaderContainer.classList.remove('hidden');

            try {
                loadingText.innerText = "Compressing your sketch for fast upload...";
                const base64Image = await compressImage(selectedFile);

                loadingText.innerText = "AI is analyzing your sketch and writing code...";
                
                const response = await fetch(BACKEND_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ image: base64Image })
                });

                const data = await response.json();

                if (!response.ok) {
                    const errMsg = data.detail || data.error || data.message || `Server Error: ${response.status}`;
                    throw new Error(errMsg);
                }

                if (data.success === false) {
                    throw new Error(data.error);
                }

                const generatedHtml = data.code || "No code returned.";
                
                // Display Raw Code
                document.getElementById('codeOutput').value = generatedHtml;

                // Render Live Preview Inside Iframe
                const iframe = document.getElementById('previewFrame');
                iframe.srcdoc = generatedHtml;

                resultContainer.classList.remove('hidden');

            } catch (error) {
                console.error("Full Error:", error);
                alert("❌ Connection Failed!\nReason: " + error.message + "\n\n💡 Make sure your backend on Render is running and live.");
            } finally {
                loaderContainer.classList.add('hidden');
                genBtn.disabled = false;
                genBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
